<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu bắt buộc | Hệ thống Quản lý TTTN</title>
    <link rel="stylesheet" href="../../css/auth/password-flow.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body class="password-flow-page">
    <main class="password-flow-card">
        <h1>Cần đổi mật khẩu</h1>
        <p>Để bảo vệ tài khoản, hãy đổi mật khẩu ban đầu trước khi tiếp tục sử dụng hệ thống.</p>
        <form id="forceChangePasswordForm">
            <label class="password-flow-field">
                <span>Mật khẩu hiện tại</span>
                <input id="currentPassword" type="password" autocomplete="current-password" required>
            </label>
            <label class="password-flow-field">
                <span>Mật khẩu mới</span>
                <input id="newPassword" type="password" autocomplete="new-password" required>
            </label>
            <label class="password-flow-field">
                <span>Nhập lại mật khẩu mới</span>
                <input id="confirmPassword" type="password" autocomplete="new-password" required>
            </label>
            <p id="forceChangeMessage" class="password-flow-message" role="status" aria-live="polite"></p>
            <button id="forceChangeSubmit" class="password-flow-submit" type="submit">Đổi mật khẩu</button>
        </form>
    </main>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth/force-change-password.js"></script>
</body>
</html>
