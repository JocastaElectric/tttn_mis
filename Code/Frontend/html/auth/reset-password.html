<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | Hệ thống Quản lý TTTN</title>
    <link rel="stylesheet" href="../../css/auth/password-flow.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body class="password-flow-page">
    <main class="password-flow-card">
        <h1>Đặt lại mật khẩu</h1>
        <p>Đặt mật khẩu mới cho tài khoản. Liên kết chỉ dùng một lần và có hiệu lực trong 15 phút.</p>
        <form id="resetPasswordForm">
            <label class="password-flow-field">
                <span>Mật khẩu mới</span>
                <input id="newPassword" type="password" autocomplete="new-password" required>
            </label>
            <label class="password-flow-field">
                <span>Nhập lại mật khẩu mới</span>
                <input id="confirmPassword" type="password" autocomplete="new-password" required>
            </label>
            <p id="resetPasswordMessage" class="password-flow-message" role="status" aria-live="polite"></p>
            <button id="resetPasswordSubmit" class="password-flow-submit" type="submit">Lưu mật khẩu mới</button>
        </form>
        <a class="password-flow-link" href="index.html">Quay lại đăng nhập</a>
    </main>
    <script src="../../js/config.js"></script>
    <script src="../../js/auth/reset-password.js"></script>
</body>
</html>
